services:
  mediflow-backend:
    image: ${MEDIFLOW_BACKEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      CLINICIAN_KAKAO_IDS: ${CLINICIAN_KAKAO_IDS}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      QUESTIONNAIRE_PUBLIC_URL: ${QUESTIONNAIRE_PUBLIC_URL}
      QUESTIONNAIRE_DELIVERY_WEBHOOK_URL: ${QUESTIONNAIRE_DELIVERY_WEBHOOK_URL}
      QUESTIONNAIRE_DELIVERY_WEBHOOK_TOKEN: ${QUESTIONNAIRE_DELIVERY_WEBHOOK_TOKEN}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: "none"
      H2_CONSOLE_ENABLED: "false"
    volumes:
      - mediflow-data:/app/data

volumes:
  mediflow-data:
