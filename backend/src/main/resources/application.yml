spring:
  application:
    name: mediflow-backend
  datasource:
    url: jdbc:h2:file:./data/mediflow;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: ${KAKAO_REST_API_KEY:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      timeout: -1
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://gudae01.github.io}
  data-encryption-key: ${APP_DATA_ENCRYPTION_KEY:}
  clinician-kakao-ids: ${CLINICIAN_KAKAO_IDS:}
  questionnaire:
    public-url: ${QUESTIONNAIRE_PUBLIC_URL:http://localhost:5173}
    delivery:
      webhook-url: ${QUESTIONNAIRE_DELIVERY_WEBHOOK_URL:}
      webhook-token: ${QUESTIONNAIRE_DELIVERY_WEBHOOK_TOKEN:}

logging:
  level:
    org.hibernate.SQL: info
