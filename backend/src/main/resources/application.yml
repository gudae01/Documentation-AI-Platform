spring:
  application:
    name: mediflow-backend
  datasource:
    url: jdbc:h2:file:./data/mediflow;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      timeout: -1
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  data-encryption-key: ${APP_DATA_ENCRYPTION_KEY:}
  local-login:
    username: ${LOCAL_LOGIN_USERNAME:root}
    password: ${LOCAL_LOGIN_PASSWORD:root}
  questionnaire:
    public-url: ${QUESTIONNAIRE_PUBLIC_URL:http://localhost:5173}
    delivery:
      webhook-url: ${QUESTIONNAIRE_DELIVERY_WEBHOOK_URL:}
      webhook-token: ${QUESTIONNAIRE_DELIVERY_WEBHOOK_TOKEN:}
  stt:
    base-url: ${STT_BASE_URL:http://localhost:8090}
    max-audio-size-mb: ${STT_MAX_AUDIO_MB:100}
    connect-timeout-seconds: ${STT_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${STT_READ_TIMEOUT_SECONDS:900}

logging:
  level:
    org.hibernate.SQL: info
